<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="molt — shed stale context, keep the session">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B24C"/>
      <stop offset="1" stop-color="#D97B3F"/>
    </linearGradient>
  </defs>
  <!-- stale transcript: five wide, noisy bars -->
  <g fill="#555C6B">
    <rect x="18" y="8" width="120" height="12" rx="6"/>
    <rect x="18" y="28" width="120" height="12" rx="6"/>
    <rect x="18" y="48" width="120" height="12" rx="6"/>
    <rect x="18" y="68" width="120" height="12" rx="6"/>
    <rect x="18" y="88" width="120" height="12" rx="6"/>
  </g>
  <!-- shed -->
  <path d="M148 52 h30" stroke="#8A91A3" stroke-width="4" stroke-dasharray="6 7" fill="none"/>
  <path d="M172 44 l12 8 -12 8" stroke="#8A91A3" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- dense summary block -->
  <rect x="196" y="28" width="64" height="52" rx="10" fill="url(#ember)"/>
  <text x="228" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#23262E" text-anchor="middle">bN</text>
  <!-- wordmark -->
  <text x="286" y="84" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="62" font-weight="800" fill="url(#ember)" letter-spacing="-1">molt</text>
</svg>
